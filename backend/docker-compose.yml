services:
  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    restart: always
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: malssenger-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra



  postgres:
    image: postgres:17

    command: >
      postgres
      -c port=5433

    environment:
      POSTGRES_USER: malsi
      POSTGRES_PASSWORD: fubkz13love
      POSTGRES_DB: malsseneger

    ports:
      - "5433:5433"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  kafka:
    image: apache/kafka:3.9.1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 10

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk


  auth:
    build:
      context: ./auth_servis

    ports:
      - "8000:8000"

    volumes:
    - ./auth_servis:/auth_servis

    environment:
      DATABASE_URL: postgresql://malsi:fubkz13love@postgres:5433/malsseneger

    depends_on:
      - postgres


  chat:
    build:
      context: ./chat_servis

    ports:
      - "8001:8001"

    volumes:
      - ./chat_servis:/chat_servis


    environment:
      DATABASE_URL: postgresql://malsi:fubkz13love@postgres:5433/malsseneger 
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started

  storage:
    build:
      context: ./storage_servis

    ports:
      - "8002:8002"

    volumes:
      - ./storage_servis:/storage_servis

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: storage-service


    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_started
      
  push:
    build:
      context: ./push_servies
    ports:
      - "8003:8003"

    volumes:
      - ./push_servies:/push_servies

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: push-service

    depends_on:
      kafka:
        condition: service_healthy


volumes:
  postgres_data:
  cassandra_data:
